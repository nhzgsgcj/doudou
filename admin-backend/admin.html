<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>照片管理 · 毛孩子的日常</title>
<style>
  :root { --bg:#f5f3ef; --card:#fff; --ink:#333; --sub:#888; --acc:#4a6fa5; --danger:#c0504d; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; }
  .wrap { max-width:960px; margin:0 auto; padding:32px 20px 60px; }
  h1 { font-size:22px; font-weight:600; margin-bottom:4px; }
  .topbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; }
  .topbar button { border:none; background:none; color:var(--acc); cursor:pointer; font-size:14px; padding:6px 10px; border-radius:8px; }
  .topbar button:hover { background:rgba(74,111,165,.1); }

  .login { max-width:360px; margin:12vh auto 0; background:var(--card); border-radius:16px; padding:36px 32px; box-shadow:0 6px 24px rgba(0,0,0,.08); }
  .login h1 { text-align:center; margin-bottom:24px; }
  .login input { width:100%; padding:12px 14px; border:1px solid #ddd; border-radius:10px; font-size:15px; outline:none; }
  .login input:focus { border-color:var(--acc); }
  .login .btn { width:100%; margin-top:16px; padding:12px; background:var(--acc); color:#fff; border:none; border-radius:10px; font-size:15px; cursor:pointer; }
  .err { color:var(--danger); font-size:13px; margin-top:12px; text-align:center; min-height:18px; }

  .upload-card { background:var(--card); border-radius:16px; padding:24px; box-shadow:0 4px 16px rgba(0,0,0,.06); margin-bottom:28px; }
  .drop { border:2px dashed #ccd; border-radius:12px; padding:36px 16px; text-align:center; color:var(--sub); cursor:pointer; transition:.2s; }
  .drop.hover { border-color:var(--acc); background:rgba(74,111,165,.05); }
  .drop b { color:var(--acc); }
  .bar { height:6px; background:#eee; border-radius:3px; margin-top:16px; overflow:hidden; display:none; }
  .bar i { display:block; height:100%; width:0; background:var(--acc); transition:width .2s; }
  .msg { margin-top:14px; font-size:14px; line-height:1.6; white-space:pre-wrap; }

  .list-head { display:flex; justify-content:space-between; align-items:baseline; margin:0 4px 12px; }
  .list-head h2 { font-size:16px; font-weight:600; }
  .list-head span { font-size:13px; color:var(--sub); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; }
  .ph { position:relative; background:var(--card); border-radius:12px; overflow:hidden; box-shadow:0 3px 10px rgba(0,0,0,.07); }
  .ph img { width:100%; height:130px; object-fit:cover; display:block; }
  .ph .meta { padding:6px 8px 8px; font-size:12px; color:var(--sub); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ph .del { position:absolute; top:6px; right:6px; width:26px; height:26px; border:none; border-radius:50%; background:rgba(0,0,0,.55); color:#fff; cursor:pointer; font-size:14px; line-height:26px; text-align:center; }
  .ph .del:hover { background:var(--danger); }
  .ph .name { padding:0 8px 6px; font-size:11px; color:#aaa; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .empty { color:var(--sub); text-align:center; padding:40px 0; }
</style>
</head>
<body>
  <!-- 登录视图 -->
  <div id="loginView" class="login" style="display:none">
    <h1>照片管理</h1>
    <input id="pwd" type="password" placeholder="管理员密码" autocomplete="current-password">
    <button class="btn" id="loginBtn">登 录</button>
    <div class="err" id="loginErr"></div>
  </div>

  <!-- 管理视图 -->
  <div id="adminView" class="wrap" style="display:none">
    <div class="topbar">
      <div>
        <h1>照片管理</h1>
        <div style="font-size:13px;color:var(--sub)">毛孩子的日常 · 华为云</div>
      </div>
      <button id="logoutBtn">退出登录</button>
    </div>

    <div class="upload-card">
      <div class="drop" id="drop">
        点击选择照片，或把照片拖到这里<br>
        支持 jpg / png / webp / gif，单张不超过 30MB，可多选
      </div>
      <input id="fileInput" type="file" accept="image/*" multiple style="display:none">
      <div class="bar" id="bar"><i id="barFill"></i></div>
      <div class="msg" id="msg"></div>
    </div>

    <div class="list-head">
      <h2>已上传照片</h2>
      <span id="count"></span>
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none">还没有照片</div>
  </div>

<script>
const $ = id => document.getElementById(id);
let photos = [];

async function api(path, opts) {
  const r = await fetch(path, Object.assign({ credentials: "same-origin" }, opts));
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(j.error || ("HTTP " + r.status));
  return j;
}

/* ── 登录 ── */
$("loginBtn").onclick = doLogin;
$("pwd").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
async function doLogin() {
  $("loginErr").textContent = "";
  try {
    await api("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: $("pwd").value }) });
    $("pwd").value = "";
    enter();
  } catch (e) { $("loginErr").textContent = e.message; }
}

async function enter() {
  $("loginView").style.display = "none";
  $("adminView").style.display = "block";
  await refresh();
}

$("logoutBtn").onclick = async () => {
  try { await api("/api/logout", { method: "POST" }); } catch (e) {}
  $("adminView").style.display = "none";
  $("loginView").style.display = "block";
};

/* ── 上传 ── */
$("drop").onclick = () => $("fileInput").click();
$("drop").addEventListener("dragover", e => { e.preventDefault(); $("drop").classList.add("hover"); });
$("drop").addEventListener("dragleave", () => $("drop").classList.remove("hover"));
$("drop").addEventListener("drop", e => {
  e.preventDefault(); $("drop").classList.remove("hover");
  uploadFiles(e.dataTransfer.files);
});
$("fileInput").onchange = e => { uploadFiles(e.target.files); e.target.value = ""; };

function uploadFiles(fileList) {
  const files = [...fileList];
  if (!files.length) return;
  const fd = new FormData();
  files.forEach(f => fd.append("files", f));
  const xhr = new XMLHttpRequest();
  xhr.open("POST", "/api/upload");
  xhr.withCredentials = true;
  $("bar").style.display = "block";
  $("msg").textContent = "正在上传 " + files.length + " 张…";
  xhr.upload.onprogress = e => {
    if (e.lengthComputable)
      $("barFill").style.width = Math.round(e.loaded * 100 / e.total) + "%";
  };
  xhr.onload = () => {
    $("bar").style.display = "none";
    $("barFill").style.width = "0";
    let j = {};
    try { j = JSON.parse(xhr.responseText); } catch (e2) {}
    if (xhr.status === 200 && j.ok) {
      let t = "成功上传 " + (j.added || []).length + " 张";
      (j.errors || []).forEach(er => { t += "\n✕ " + er.file + "：" + er.error; });
      $("msg").textContent = t;
      refresh();
    } else {
      $("msg").textContent = "上传失败：" + (j.error || ("HTTP " + xhr.status)) +
        (xhr.status === 401 ? "，请刷新页面重新登录" : "");
    }
  };
  xhr.onerror = () => { $("bar").style.display = "none"; $("msg").textContent = "网络错误，上传中断"; };
  xhr.send(fd);
}

/* ── 列表 ── */
async function refresh() {
  try {
    const j = await api("/api/photos");
    photos = j.photos || [];
  } catch (e) {
    if (e.message.includes("401")) { $("adminView").style.display = "none"; $("loginView").style.display = "block"; return; }
    $("msg").textContent = "加载列表失败：" + e.message;
    return;
  }
  $("count").textContent = "共 " + photos.length + " 张";
  $("empty").style.display = photos.length ? "none" : "block";
  const grid = $("grid");
  grid.innerHTML = "";
  photos.forEach(p => {
    const d = document.createElement("div");
    d.className = "ph";
    const stem = (p.src || "").split("/").pop().replace(/\.[^.]+$/, "");
    const img = document.createElement("img");
    img.src = "/resource/thumbs/" + stem + ".webp";
    img.loading = "lazy";
    img.onerror = () => { img.src = p.src; };
    const del = document.createElement("button");
    del.className = "del"; del.textContent = "×"; del.title = "删除这张照片";
    del.onclick = async () => {
      if (!confirm("确定删除这张照片吗？删除后不可恢复。")) return;
      del.disabled = true;
      try {
        await api("/api/delete", { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ src: p.src }) });
        refresh();
      } catch (e2) { alert("删除失败：" + e2.message); del.disabled = false; }
    };
    const meta = document.createElement("div");
    meta.className = "meta"; meta.textContent = p.title || p.date || "";
    const name = document.createElement("div");
    name.className = "name"; name.textContent = stem;
    d.append(del, img, meta, name);
    grid.appendChild(d);
  });
}

/* ── 启动 ── */
(async () => {
  try {
    const j = await api("/api/check");
    if (j.auth) enter(); else $("loginView").style.display = "block";
  } catch (e) { $("loginView").style.display = "block"; }
})();
</script>
</body>
</html>
