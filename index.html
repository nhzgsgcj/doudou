<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>毛孩子的日常</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    color: #eee;
    background:
      radial-gradient(1100px 500px at 85% -10%, rgba(64,90,140,.35), transparent 60%),
      radial-gradient(900px 480px at -10% 110%, rgba(120,70,60,.28), transparent 60%),
      linear-gradient(160deg, #10141d 0%, #171c28 55%, #10131b 100%);
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  img { display: block; }
  a { color: inherit; text-decoration: none; }

  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 20px; width: 100%; }

  /* ── 第一行：站头 ───────────────────────────── */
  .site-header { flex: none; padding: 14px 0 6px; }
  .site-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .brand {
    display: flex;
    align-items: center;
    font-size: 25px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #fff;
    white-space: nowrap;
  }
  .brand .mark {
    width: 4px;
    height: 20px;
    background: #e63946;
    margin-right: 10px;
    border-radius: 2px;
  }
  .site-meta {
    font-size: 12px;
    color: rgba(255,255,255,.55);
    letter-spacing: .5px;
    white-space: nowrap;
  }

  /* ── 第二行：轮播 ───────────────────────────── */
  .hero-wrap { flex: none; padding: 10px 0 4px; }
  .hero {
    position: relative;
    background: #0c0f16;
    overflow: hidden;
    border-radius: 18px;
    box-shadow: 0 12px 34px rgba(0,0,0,.45);
  }
  .hero-track { position: relative; aspect-ratio: 16 / 6.4; }
  .slide {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity .7s ease;
  }
  .slide.on { opacity: 1; }
  .slide img { width: 100%; height: 100%; object-fit: cover; }
  .slide-cap {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 60px 22px 14px;
    background: linear-gradient(to top, rgba(0,0,0,.72), rgba(0,0,0,.22) 55%, transparent);
    color: #fff;
    font-size: 14px;
    letter-spacing: .5px;
  }
  .slide-cap .date { font-size: 12px; opacity: .75; margin-right: 8px; }
  .hero-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 40px;
    height: 64px;
    border: none;
    background: rgba(0,0,0,.35);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    opacity: 0;
    transition: opacity .25s, background .25s;
  }
  .hero:hover .hero-btn { opacity: 1; }
  .hero-btn:hover { background: rgba(230,57,70,.85); }
  .hero-prev { left: 0; border-radius: 12px 0 0 12px; }
  .hero-next { right: 0; border-radius: 0 12px 12px 0; }
  .hero-dots {
    position: absolute;
    right: 18px;
    bottom: 14px;
    display: flex;
    gap: 7px;
    z-index: 5;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,.45);
    cursor: pointer;
    transition: background .25s, transform .25s;
  }
  .dot.on { background: #fff; transform: scale(1.15); }

  /* ── 栏目标题 ───────────────────────────────── */
  .section-head {
    flex: none;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 14px 0 8px;
  }
  .sec-title {
    position: relative;
    padding-left: 11px;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 1px;
  }
  .sec-title::before {
    content: "";
    position: absolute;
    left: 0;
    top: 4px;
    bottom: 4px;
    width: 3px;
    background: #e63946;
    border-radius: 2px;
  }
  .sec-extra { font-size: 12px; color: rgba(255,255,255,.45); }

  /* ── 第三行：照片卡片墙（独立滚动区） ───────── */
  .scrollzone {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,.22) transparent;
  }
  .scrollzone::-webkit-scrollbar { width: 8px; }
  .scrollzone::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,.22);
    border-radius: 8px;
  }
  .scrollzone::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.35); }
  .scrollzone::-webkit-scrollbar-track { background: transparent; }

  .cards {
    display: flex;
    flex-wrap: wrap;
    gap: 26px 22px;
    padding: 6px 0 26px;
  }
  .group { width: calc(25% - 16.5px); min-width: 220px; flex-grow: 1; }
  .gcard {
    position: relative;
    background: rgba(255,255,255,.94);
    border-radius: 16px;
    padding: 10px;
    box-shadow: 0 10px 26px rgba(0,0,0,.38);
    transition: transform .3s ease, box-shadow .3s ease;
  }
  .group:hover .gcard {
    transform: translateY(-4px);
    box-shadow: 0 16px 34px rgba(0,0,0,.5);
  }
  .gthumbs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-auto-rows: 1fr;
    gap: 8px;
    aspect-ratio: 1 / 0.92;
  }
  .gthumb {
    position: relative;
    overflow: hidden;
    border-radius: 10px;
    background: #e8e8ee;
    cursor: zoom-in;
  }
  .gthumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform .55s cubic-bezier(.2,.6,.3,1), filter .4s ease;
  }
  .gthumb:hover img { transform: scale(1.12); filter: brightness(1.05); }
  /* 只有一张照片时撑满整张卡片 */
  .gthumbs.single { grid-template-columns: 1fr; aspect-ratio: 1 / 0.66; }
  .gthumb.more { cursor: pointer; }
  .gthumb .more-num {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(20,24,34,.55);
    color: #fff;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 1px;
  }
  .gthumb .more-num::before { content: "+"; font-weight: 400; margin-right: 2px; }
  .gbadge {
    position: absolute;
    top: 8px;
    right: 8px;
    z-index: 3;
    background: rgba(230,57,70,.92);
    color: #fff;
    font-size: 11px;
    line-height: 1;
    padding: 5px 9px;
    border-radius: 999px;
    letter-spacing: .5px;
    box-shadow: 0 4px 10px rgba(0,0,0,.3);
  }
  .glabel {
    margin-top: 10px;
    text-align: center;
    font-size: 13px;
    color: rgba(255,255,255,.88);
    letter-spacing: 1px;
  }
  .glabel .cnt { font-size: 11px; color: rgba(255,255,255,.45); margin-left: 6px; }

  .empty { padding: 60px 0; text-align: center; color: rgba(255,255,255,.5); }

  /* ── 第四行：页脚（内容待定） ────────────────── */
  .site-footer {
    flex: none;
    border-top: 1px solid rgba(255,255,255,.08);
    background: rgba(255,255,255,.04);
    padding: 18px 0 20px;
    color: rgba(255,255,255,.5);
    font-size: 12px;
  }
  .footer-inner {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 24px;
    align-items: center;
    justify-content: space-between;
  }
  .footer-links { display: flex; gap: 18px; }
  .footer-links span { color: rgba(255,255,255,.3); }

  /* ── 看大图 ─────────────────────────────────── */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.94);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .lightbox.open { display: flex; }
  .lightbox img {
    max-width: 92vw;
    max-height: 86vh;
    box-shadow: 0 0 40px rgba(0,0,0,.6);
  }
  .lb-btn {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    width: 52px;
    height: 52px;
    border: none;
    border-radius: 50%;
    background: rgba(255,255,255,.14);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    transition: background .2s;
  }
  .lb-btn:hover { background: rgba(230,57,70,.9); }
  .lb-prev { left: 18px; }
  .lb-next { right: 18px; }
  .lb-close {
    position: fixed;
    top: 14px;
    right: 20px;
    background: none;
    border: none;
    color: #fff;
    font-size: 30px;
    line-height: 1;
    cursor: pointer;
  }
  .lb-count {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    color: rgba(255,255,255,.8);
    font-size: 12px;
    letter-spacing: 2px;
    max-width: 90vw;
    text-align: center;
  }

  @media (max-width: 1000px) {
    .group { width: calc(33.34% - 14.7px); }
  }
  @media (max-width: 900px) {
    .hero-track { aspect-ratio: 16 / 9; }
    .brand { font-size: 22px; }
  }
  @media (max-width: 640px) {
    .group { width: calc(50% - 11px); min-width: 150px; }
    .hero-track { aspect-ratio: 4 / 3; }
    .site-meta { display: none; }
    .brand { font-size: 20px; letter-spacing: 1px; }
    .footer-inner { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>

<!-- 第一行：标题 -->
<header class="site-header">
  <div class="wrap site-inner">
    <div class="brand"><span class="mark"></span><span id="siteTitle">毛孩子的日常</span></div>
    <div class="site-meta" id="siteMeta"></div>
  </div>
</header>

<!-- 第二行：轮播（最新 5 张） -->
<div class="hero-wrap wrap">
  <section class="hero" id="hero">
    <div class="hero-track" id="heroTrack"></div>
    <button class="hero-btn hero-prev" id="heroPrev" aria-label="上一张">&lsaquo;</button>
    <button class="hero-btn hero-next" id="heroNext" aria-label="下一张">&rsaquo;</button>
    <div class="hero-dots" id="heroDots"></div>
  </section>
</div>

<!-- 栏目标题 -->
<div class="wrap section-head">
  <h2 class="sec-title">照片墙</h2>
  <span class="sec-extra" id="gridCount"></span>
</div>

<!-- 第三行：照片卡片墙 —— 鼠标滚轮在此区域内上下滚动 -->
<main class="wrap scrollzone" id="scrollzone">
  <div class="cards" id="cards"></div>
</main>

<!-- 第四行：页脚（位置保留，内容后续替换） -->
<footer class="site-footer">
  <div class="wrap footer-inner">
    <div id="siteFooter">页脚区域 · 内容待补充</div>
    <div class="footer-links">
      <span>栏目一</span><span>栏目二</span><span>栏目三</span>
    </div>
  </div>
</footer>

<!-- 看大图 -->
<div class="lightbox" id="lightbox">
  <button class="lb-btn lb-prev" onclick="step(-1)">&larr;</button>
  <img id="lbImg" src="" alt="">
  <button class="lb-btn lb-next" onclick="step(1)">&rarr;</button>
  <button class="lb-close" onclick="closeLb()">&times;</button>
  <div class="lb-count" id="lbCount"></div>
</div>

<script>
/* 数据来自 data/photos.json 与 data/site.json（由 Pages CMS 后台维护） */
const FALLBACK_SITE = {
  title: "毛孩子的日常",
  subtitle: "",
  footer: "页脚区域 · 内容待补充"
};

const FALLBACK_PHOTOS = [
  "resource/jpg/IMG_20221220_092029.jpg",
  "resource/jpg/IMG_20230122_215209.jpg",
  "resource/jpg/IMG_20240713_210719.jpg",
  "resource/jpg/IMG_20251220_111019.jpg",
  "resource/jpg/IMG_20260326_105623.jpg",
  "resource/jpg/mmexport1630833163308.jpg",
  "resource/jpg/mmexport1635083111776.jpg",
  "resource/jpg/mmexport1640079407378.jpg",
  "resource/jpg/mmexport1674302285357.jpg",
  "resource/jpg/mmexport1674302288178.jpg",
  "resource/jpg/mmexport1674302290029.jpg",
  "resource/jpg/mmexport1755567784194.jpg",
  "resource/jpg/mmexport1761823362289.jpg",
  "resource/jpg/synthesis_df4e14a4-caa0-489b-8467-213893a9db76_i.jpg",
  "resource/jpg/wx_camera_1630583256505.jpg",
  "resource/jpg/wx_camera_1713361493189.jpg",
  "resource/jpg/wx_camera_1721562574208.jpg",
  "resource/jpg/wx_camera_1723602584733.jpg",
  "resource/jpg/wx_camera_1723604246051.jpg",
  "resource/jpg/wx_camera_1726366990254.jpg",
  "resource/jpg/wx_camera_1755141865991.jpg",
  "resource/jpg/wx_camera_1756119501920.jpg",
  "resource/jpg/wx_camera_1782901912680.jpg"
].map(src => ({ src: src, title: "", date: "" }));

const HERO_COUNT = 5;      // 轮播展示最新 5 张
const AUTOPLAY_MS = 5000;  // 自动切换间隔
const MAX_PER_CARD = 4;    // 每张卡片内最多 4 张缩略图

function normalize(src) {
  return String(src || "").replace(/^\/+/, "");
}

async function loadJSON(url, fallback) {
  try {
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    return await res.json();
  } catch (err) {
    return fallback;
  }
}

let photos = [];
let heroIndex = 0;
let heroTimer = null;

/* ── 站头 / 页脚 ── */
function applySite(site) {
  const s = Object.assign({}, FALLBACK_SITE, site || {});
  document.title = s.title;
  document.getElementById("siteTitle").textContent = s.title;
  document.getElementById("siteFooter").textContent = s.footer || FALLBACK_SITE.footer;
}

/* ── 轮播 ── */
function buildHero(list) {
  const track = document.getElementById("heroTrack");
  const dots = document.getElementById("heroDots");
  track.innerHTML = "";
  dots.innerHTML = "";

  const items = list.slice(0, HERO_COUNT);
  if (!items.length) {
    document.getElementById("hero").style.display = "none";
    return;
  }

  items.forEach((p, i) => {
    const slide = document.createElement("div");
    slide.className = "slide" + (i === 0 ? " on" : "");

    const img = document.createElement("img");
    img.src = p.src;
    img.alt = p.title || ("照片 " + (i + 1));
    img.loading = i === 0 ? "eager" : "lazy";
    slide.appendChild(img);

    if (p.title || p.date) {
      const cap = document.createElement("div");
      cap.className = "slide-cap";
      if (p.date) {
        const d = document.createElement("span");
        d.className = "date";
        d.textContent = p.date;
        cap.appendChild(d);
      }
      cap.appendChild(document.createTextNode(p.title || ""));
      slide.appendChild(cap);
    }

    slide.addEventListener("click", () => openLb(i));
    track.appendChild(slide);

    const dot = document.createElement("div");
    dot.className = "dot" + (i === 0 ? " on" : "");
    dot.addEventListener("click", () => goHero(i));
    dots.appendChild(dot);
  });

  startAuto();
}

function goHero(i) {
  const slides = document.querySelectorAll("#heroTrack .slide");
  const dots = document.querySelectorAll("#heroDots .dot");
  if (!slides.length) return;
  heroIndex = (i + slides.length) % slides.length;
  slides.forEach((s, k) => s.classList.toggle("on", k === heroIndex));
  dots.forEach((d, k) => d.classList.toggle("on", k === heroIndex));
}

function startAuto() {
  stopAuto();
  if (document.querySelectorAll("#heroTrack .slide").length < 2) return;
  heroTimer = setInterval(() => goHero(heroIndex + 1), AUTOPLAY_MS);
}
function stopAuto() {
  if (heroTimer) { clearInterval(heroTimer); heroTimer = null; }
}

/* ── 照片卡片墙：按月份分组成圆角卡片 ── */
function monthLabel(key) {
  const m = key.match(/^(\d{4})-(\d{2})$/);
  if (m) return m[1] + "年" + Number(m[2]) + "月";
  return "其他照片";
}

function buildCards(list) {
  const wrap = document.getElementById("cards");
  wrap.innerHTML = "";

  if (!list.length) {
    const tip = document.createElement("div");
    tip.className = "empty";
    tip.textContent = "还没有照片，去后台添加第一张吧。";
    wrap.appendChild(tip);
    document.getElementById("gridCount").textContent = "";
    return;
  }

  /* 按月份分组（键：YYYY-MM，无日期归入"其他"），保持倒序 */
  const order = [];
  const groups = new Map();
  list.forEach(p => {
    const key = (p.date && /^\d{4}-\d{2}/.test(p.date)) ? p.date.slice(0, 7) : "other";
    if (!groups.has(key)) { groups.set(key, []); order.push(key); }
    groups.get(key).push(p);
  });

  order.forEach(key => {
    const items = groups.get(key);
    const gi = photos.indexOf(items[0]); // 组内第一张在全局列表中的位置（灯箱定位用）

    const group = document.createElement("div");
    group.className = "group";

    const card = document.createElement("div");
    card.className = "gcard";

    const badge = document.createElement("span");
    badge.className = "gbadge";
    badge.textContent = items.length + " 张";
    card.appendChild(badge);

    const thumbs = document.createElement("div");
    thumbs.className = "gthumbs";

    const show = items.slice(0, MAX_PER_CARD);
    const rest = items.length - show.length;

    if (items.length === 1) thumbs.classList.add("single");

    show.forEach(p => {
      const t = document.createElement("div");
      t.className = "gthumb";
      const img = document.createElement("img");
      img.src = p.src;
      img.alt = p.title || p.date || "";
      img.loading = "lazy";
      t.appendChild(img);
      t.addEventListener("click", () => openLb(photos.indexOf(p)));
      thumbs.appendChild(t);
    });

    if (rest > 0) {
      const t = document.createElement("div");
      t.className = "gthumb more";
      const img = document.createElement("img");
      img.src = items[MAX_PER_CARD].src;
      img.loading = "lazy";
      img.style.opacity = ".55";
      t.appendChild(img);
      const num = document.createElement("span");
      num.className = "more-num";
      num.textContent = rest;
      t.appendChild(num);
      /* 点击"+N"从第 5 张开始看 */
      t.addEventListener("click", () => openLb(photos.indexOf(items[MAX_PER_CARD])));
      thumbs.appendChild(t);
    } else if (show.length === 3) {
      /* 只有三张时最后一格留白，保持整齐 */
      const t = document.createElement("div");
      t.className = "gthumb";
      t.style.visibility = "hidden";
      thumbs.appendChild(t);
    }

    card.appendChild(thumbs);
    group.appendChild(card);

    const label = document.createElement("div");
    label.className = "glabel";
    label.textContent = monthLabel(key);
    const cnt = document.createElement("span");
    cnt.className = "cnt";
    cnt.textContent = items.length + " 张";
    label.appendChild(cnt);
    group.appendChild(label);

    wrap.appendChild(group);
    void gi;
  });

  document.getElementById("gridCount").textContent =
    "共 " + list.length + " 张 · " + order.length + " 个相册 · 滚轮上下滚动";
}

/* ── 看大图 ── */
let cur = 0;
const lb = document.getElementById("lightbox");
const lbImg = document.getElementById("lbImg");
const lbCount = document.getElementById("lbCount");

function openLb(i) {
  cur = i;
  show();
  lb.classList.add("open");
  stopAuto();
}
function closeLb() {
  lb.classList.remove("open");
  startAuto();
}
function step(d) {
  if (!photos.length) return;
  cur = (cur + d + photos.length) % photos.length;
  show();
}
function show() {
  const p = photos[cur];
  if (!p) return;
  lbImg.src = p.src;
  lbImg.alt = p.title || ("照片 " + (cur + 1));
  let label = (cur + 1) + " / " + photos.length;
  if (p.title) label += " · " + p.title;
  else if (p.date) label += " · " + p.date;
  lbCount.textContent = label;
}

document.addEventListener("keydown", e => {
  if (!lb.classList.contains("open")) return;
  if (e.key === "Escape") closeLb();
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});
lb.addEventListener("click", e => { if (e.target === lb) closeLb(); });

document.getElementById("heroPrev").addEventListener("click", () => { goHero(heroIndex - 1); startAuto(); });
document.getElementById("heroNext").addEventListener("click", () => { goHero(heroIndex + 1); startAuto(); });
document.getElementById("hero").addEventListener("mouseenter", stopAuto);
document.getElementById("hero").addEventListener("mouseleave", startAuto);

/* ── 启动 ── */
(async function init() {
  const site = await loadJSON("data/site.json", FALLBACK_SITE);
  applySite(site);

  const list = await loadJSON("data/photos.json", null);
  photos = (Array.isArray(list) ? list : FALLBACK_PHOTOS)
    .filter(p => p && p.src)
    .map(p => ({ src: normalize(p.src), title: p.title || "", date: p.date || "" }));

  /* 按拍摄日期倒序（后台新上传的照片会追加到列表末尾，这里统一重排） */
  photos.sort((a, b) => {
    if (!a.date && !b.date) return 0;
    if (!a.date) return 1;
    if (!b.date) return -1;
    return b.date.localeCompare(a.date);
  });

  const total = photos.length;
  document.getElementById("siteMeta").textContent =
    "共 " + total + " 张照片 · 持续更新";

  buildHero(photos);
  buildCards(photos);
})();
</script>
</body>
</html>
