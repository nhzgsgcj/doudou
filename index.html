<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>毛孩子的日常</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    color: #333;
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background-attachment: fixed;
    background-size: cover;
    background-position: center;
    transition: background .4s ease;
  }
  img { display: block; }
  a { color: inherit; text-decoration: none; }

  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 20px; width: 100%; }

  /* ── 第一行：站头（时钟 + 标题 + 换背景） ───── */
  .site-header { flex: none; padding: 14px 0 24px; position: relative; z-index: 60; }
  .site-inner {
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .clock { flex: none; line-height: 1.1; }
  .clock .time {
    font-size: 30px;
    font-weight: 600;
    letter-spacing: 1px;
    color: #1e2c44;
  }
  .clock .date {
    margin-top: 4px;
    font-size: 12px;
    color: rgba(30,44,68,.6);
    letter-spacing: .5px;
    white-space: nowrap;
  }
  .brand {
    display: flex;
    align-items: center;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #1e2c44;
    white-space: nowrap;
    padding-left: 18px;
    border-left: 1px solid rgba(30,60,110,.16);
  }
  .brand .mark {
    width: 4px;
    height: 18px;
    background: #e63946;
    margin-right: 9px;
    border-radius: 2px;
  }
  .head-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 14px;
    position: relative;
  }
  .site-meta {
    font-size: 12px;
    color: rgba(30,44,68,.55);
    letter-spacing: .5px;
    white-space: nowrap;
  }
  .bg-btn {
    display: inline-flex;
    align-items: center;
    height: 34px;
    padding: 0 18px;
    border: none;
    border-radius: 10px;
    background: transparent;
    color: #2a3b55;
    font-size: 13px;
    letter-spacing: .5px;
    cursor: pointer;
    transition: background .22s, transform .22s;
    font-family: inherit;
  }
  .bg-btn:hover { background: rgba(255,255,255,.3); transform: translateY(-1px); }

  /* 换背景面板 */
  .bg-panel {
    display: none;
    position: absolute;
    top: 46px;
    right: 0;
    width: 268px;
    padding: 14px;
    border-radius: 16px;
    background: rgba(255,255,255,.98);
    border: 1px solid rgba(30,60,110,.12);
    box-shadow: 0 18px 44px rgba(40,70,120,.22);
  }
  .bg-panel.open { display: block; }
  .bg-panel h4 {
    font-size: 12px;
    font-weight: 500;
    color: rgba(30,44,68,.55);
    letter-spacing: 1px;
    margin-bottom: 10px;
  }
  .swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .sw {
    height: 40px;
    border-radius: 9px;
    border: 2px solid transparent;
    cursor: pointer;
    position: relative;
    transition: transform .2s, border-color .2s;
  }
  .sw:hover { transform: translateY(-2px); }
  .sw.on { border-color: #e63946; }
  .sw span {
    position: absolute;
    inset: auto 0 1px 0;
    font-size: 9px;
    text-align: center;
    color: rgba(30,44,68,.7);
  }
  .bg-upload {
    margin-top: 12px;
    display: flex;
    gap: 8px;
  }
  .bg-upload button {
    flex: 1;
    height: 32px;
    border-radius: 9px;
    border: 1px solid rgba(30,60,110,.18);
    background: rgba(255,255,255,.9);
    color: #2a3b55;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    transition: background .2s;
  }
  .bg-upload button:hover { background: #f0f5fc; }

  /* ── 照片墙：独立滚动区，背景铺在内容层上、随滚动移动 ── */
  /* ── 照片墙：独立滚动区，顶部边缘渐隐 ── */
  .scrollzone {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-width: none;          /* Firefox 隐藏 */
    -ms-overflow-style: none;       /* IE/旧 Edge 隐藏 */
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 44px);
    mask-image: linear-gradient(to bottom, transparent 0, #000 44px);
  }
  .scrollzone::-webkit-scrollbar { display: none; }  /* Chrome/旧 Edge 隐藏 */

  .cards-holder { position: relative; z-index: 1; }

  /* 瀑布流：JS 分列，卡片比例错落 */
  .pcards {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 4px 2px 28px;
  }
  .pcol {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .pthumb {
    position: relative;
    overflow: hidden;
    border-radius: 12px;
    background: #dde7f3;
    cursor: zoom-in;
    box-shadow: 0 6px 16px rgba(50,80,130,.14);
    transition: transform .3s ease, box-shadow .3s ease;
    /* 四边半透明边框带（硬边过渡，非渐隐）：中心全实，四边一圈 42% 透明 */
    opacity: 1;
    -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,.42) 0, rgba(0,0,0,.42) 5%, #000 5%, #000 95%, rgba(0,0,0,.42) 95%, rgba(0,0,0,.42) 100%),
                        linear-gradient(to right, rgba(0,0,0,.42) 0, rgba(0,0,0,.42) 5%, #000 5%, #000 95%, rgba(0,0,0,.42) 95%, rgba(0,0,0,.42) 100%);
    -webkit-mask-composite: source-in;
    mask-image: linear-gradient(to bottom, rgba(0,0,0,.42) 0, rgba(0,0,0,.42) 5%, #000 5%, #000 95%, rgba(0,0,0,.42) 95%, rgba(0,0,0,.42) 100%),
                linear-gradient(to right, rgba(0,0,0,.42) 0, rgba(0,0,0,.42) 5%, #000 5%, #000 95%, rgba(0,0,0,.42) 95%, rgba(0,0,0,.42) 100%);
    mask-composite: intersect;
    transition: transform .3s ease, box-shadow .3s ease, opacity .3s ease;
  }
  .pthumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform .55s cubic-bezier(.2,.6,.3,1), filter .4s ease;
  }
  .pcard:hover .pthumb {
    /* 悬停时取消羽化，边缘恢复清晰 */
    -webkit-mask-image: none;
    mask-image: none;
    transform: translateY(-3px);
    box-shadow: 0 12px 26px rgba(50,80,130,.24);
  }
  .pcard:hover .pthumb img { transform: scale(1.06); filter: brightness(1.03); }
  .plabel {
    margin-top: 8px;
    text-align: center;
    font-size: 12px;
    color: rgba(35,52,80,.75);
    letter-spacing: .5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .empty { width: 100%; padding: 60px 0; text-align: center; color: rgba(35,52,80,.5); }

  /* ── 页脚（内容待定） ───────────────────────── */
  .site-footer {
    flex: none;
    border-top: 1px solid rgba(30,60,110,.1);
    background: rgba(255,255,255,.6);
    padding: 16px 0 18px;
    color: rgba(40,58,88,.55);
    font-size: 12px;
  }
  .footer-inner {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 24px;
    align-items: center;
    justify-content: space-between;
  }
  .footer-links { display: flex; gap: 18px; }
  .footer-links span { color: rgba(40,58,88,.35); }

  /* ── 看大图 ─────────────────────────────────── */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10,16,26,.92);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .lightbox.open { display: flex; }
  .lightbox img {
    max-width: 92vw;
    max-height: 86vh;
    box-shadow: 0 0 40px rgba(0,0,0,.6);
  }
  .lb-btn {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    width: 52px;
    height: 52px;
    border: none;
    border-radius: 50%;
    background: rgba(255,255,255,.14);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    transition: background .2s;
  }
  .lb-btn:hover { background: rgba(230,57,70,.9); }
  .lb-prev { left: 18px; }
  .lb-next { right: 18px; }
  .lb-close {
    position: fixed;
    top: 14px;
    right: 20px;
    background: none;
    border: none;
    color: #fff;
    font-size: 30px;
    line-height: 1;
    cursor: pointer;
  }
  .lb-count {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    color: rgba(255,255,255,.8);
    font-size: 12px;
    letter-spacing: 2px;
    max-width: 90vw;
    text-align: center;
  }

  @media (max-width: 900px) {
    .brand { font-size: 19px; padding-left: 12px; }
    .clock .time { font-size: 25px; }
  }
  @media (max-width: 640px) {
    .site-meta { display: none; }
    .site-inner { gap: 10px; }
    .clock .time { font-size: 22px; }
    .clock .date { font-size: 11px; }
    .brand { font-size: 17px; letter-spacing: 1px; }
    .bg-btn { padding: 0 12px; height: 30px; font-size: 12px; }
    .footer-inner { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>

<!-- 第一行：时钟 + 标题 + 换背景 -->
<header class="site-header">
  <div class="wrap site-inner">
    <div class="clock">
      <div class="time" id="clockTime">--:--</div>
      <div class="date" id="clockDate">&nbsp;</div>
    </div>
    <div class="brand"><span class="mark"></span><span id="siteTitle">毛孩子的日常</span></div>
    <div class="head-right">
      <span class="site-meta" id="siteMeta"></span>
      <button class="bg-btn" id="bgBtn" aria-haspopup="true" aria-expanded="false">换背景</button>
      <div class="bg-panel" id="bgPanel">
        <h4>选择背景</h4>
        <div class="swatches" id="swatches"></div>
        <div class="bg-upload">
          <button id="bgUpload">上传本地图片</button>
          <button id="bgReset">恢复默认</button>
        </div>
      </div>
    </div>
  </div>
</header>

<!-- 照片墙 —— 滚轮在此区域内滚动，与整页共用同一层背景 -->
<main class="wrap scrollzone" id="scrollzone">
  <div class="cards-holder">
    <div class="pcards" id="cards"></div>
  </div>
</main>

<!-- 页脚（位置保留，内容后续替换） -->
<footer class="site-footer">
  <div class="wrap footer-inner">
    <div id="siteFooter">页脚区域 · 内容待补充</div>
    <div class="footer-links">
      <span>栏目一</span><span>栏目二</span><span>栏目三</span>
    </div>
  </div>
</footer>

<!-- 看大图 -->
<div class="lightbox" id="lightbox">
  <button class="lb-btn lb-prev" onclick="step(-1)">&larr;</button>
  <img id="lbImg" src="" alt="">
  <button class="lb-btn lb-next" onclick="step(1)">&rarr;</button>
  <button class="lb-close" onclick="closeLb()">&times;</button>
  <div class="lb-count" id="lbCount"></div>
</div>

<script>
/* ── 数据来自 data/photos.json 与 data/site.json（由 Pages CMS 后台维护） ── */
const FALLBACK_SITE = {
  title: "毛孩子的日常",
  subtitle: "",
  footer: "页脚区域 · 内容待补充"
};

const FALLBACK_PHOTOS = [
  "resource/jpg/IMG_20221220_092029.jpg",
  "resource/jpg/IMG_20230122_215209.jpg",
  "resource/jpg/IMG_20240713_210719.jpg",
  "resource/jpg/IMG_20260326_105623.jpg",
  "resource/jpg/mmexport1630833163308.jpg",
  "resource/jpg/mmexport1761823362289.jpg",
  "resource/jpg/synthesis_df4e14a4-caa0-489b-8467-213893a9db76_i.jpg",
  "resource/jpg/wx_camera_1723602584733.jpg"
].map(src => ({ src: src, title: "", date: "" }));

function normalize(src) {
  return String(src || "").replace(/^\/+/, "");
}

async function loadJSON(url, fallback) {
  try {
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    return await res.json();
  } catch (err) {
    return fallback;
  }
}

/* ── 时钟：时间 + 公历 + 星期 + 农历 ── */
const WD = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
let lunarFmt = null;
try {
  lunarFmt = new Intl.DateTimeFormat("zh-CN-u-ca-chinese", {
    dateStyle: "long", timeZone: "Asia/Shanghai"
  });
} catch (e) { lunarFmt = null; }

function lunarText(d) {
  if (!lunarFmt) return "";
  try {
    const s = lunarFmt.format(d);
    const i = s.indexOf("年");
    return i >= 0 ? s.slice(i + 1) : s;
  } catch (e) { return ""; }
}

function tickClock() {
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, "0");
  const mm = String(now.getMinutes()).padStart(2, "0");
  document.getElementById("clockTime").textContent = hh + ":" + mm;

  let text = (now.getMonth() + 1) + "月" + now.getDate() + "日 " + WD[now.getDay()];
  const lunar = lunarText(now);
  if (lunar) text += " " + lunar;
  document.getElementById("clockDate").textContent = text;
}
tickClock();
setInterval(tickClock, 1000 * 10);

/* ── 背景：浅色调预设 + 自定义上传，铺在内容层、随滚动移动 ── */
const BG_PRESETS = [
  {
    id: "sky",
    name: "晨蓝",
    css: "linear-gradient(180deg, #f7fafe 0%, #e3eefb 42%, #d5e6f8 100%)"
  },
  {
    id: "cloud",
    name: "云白",
    css: "linear-gradient(180deg, #fbfcfe 0%, #eef2f8 55%, #e2e9f2 100%)"
  },
  {
    id: "mint",
    name: "浅青",
    css: "linear-gradient(180deg, #f6fbfa 0%, #e2f2ee 50%, #d3e9e3 100%)"
  },
  {
    id: "cream",
    name: "暖米",
    css: "linear-gradient(180deg, #fdfbf7 0%, #f7efe3 52%, #efe3d1 100%)"
  },
  {
    id: "lilac",
    name: "浅紫",
    css: "linear-gradient(180deg, #faf9fe 0%, #ecebfa 50%, #dedcf5 100%)"
  }
];

const BG_KEY = "doudou_bg";
const BG_IMG_KEY = "doudou_bg_img";

function applyPreset(preset) {
  document.body.style.backgroundImage = preset.css;
  document.body.style.backgroundSize = "cover";
  markSwatch(preset.id);
}
function applyCustomImage(dataUrl) {
  /* 浅色蒙版保证深色文字可读，同时保留图片色调 */
  document.body.style.backgroundImage =
    "linear-gradient(rgba(247,250,254,.45), rgba(247,250,254,.45)), url('" + dataUrl + "')";
  document.body.style.backgroundSize = "cover";
  markSwatch("custom");
}
function markSwatch(id) {
  document.querySelectorAll(".sw").forEach(el => el.classList.toggle("on", el.dataset.id === id));
}

/* 生成色块预览 */
(function renderSwatches() {
  const box = document.getElementById("swatches");
  BG_PRESETS.forEach(p => {
    const el = document.createElement("div");
    el.className = "sw";
    el.dataset.id = p.id;
    el.style.background = p.css;
    el.title = p.name;
    el.addEventListener("click", () => {
      applyPreset(p);
      try { localStorage.setItem(BG_KEY, p.id); localStorage.removeItem(BG_IMG_KEY); } catch (e) {}
    });
    box.appendChild(el);
  });
  /* 自定义背景的色块（有自定义图时出现） */
  const cus = document.createElement("div");
  cus.className = "sw";
  cus.dataset.id = "custom";
  cus.style.display = "none";
  cus.title = "自定义";
  cus.style.borderStyle = "dashed";
  cus.style.borderColor = "rgba(30,60,110,.35)";
  cus.addEventListener("click", () => {
    const saved = localStorage.getItem(BG_IMG_KEY);
    if (saved) { applyCustomImage(saved); localStorage.setItem(BG_KEY, "custom"); }
  });
  box.appendChild(cus);
})();

/* 恢复已保存的背景（兼容旧版深色预设，旧值一律回到默认） */
(function restoreBg() {
  let savedId = null, img = null;
  try { savedId = localStorage.getItem(BG_KEY); img = localStorage.getItem(BG_IMG_KEY); } catch (e) {}
  if (savedId === "custom" && img) {
    applyCustomImage(img);
  } else {
    const p = BG_PRESETS.find(x => x.id === savedId) || BG_PRESETS[0];
    applyPreset(p);
  }
})();

/* 面板开关 */
const bgBtn = document.getElementById("bgBtn");
const bgPanel = document.getElementById("bgPanel");
bgBtn.addEventListener("click", e => {
  e.stopPropagation();
  const open = bgPanel.classList.toggle("open");
  bgBtn.setAttribute("aria-expanded", open ? "true" : "false");
});
document.addEventListener("click", e => {
  if (!bgPanel.contains(e.target) && e.target !== bgBtn) {
    bgPanel.classList.remove("open");
    bgBtn.setAttribute("aria-expanded", "false");
  }
});

/* 上传本地图片作为背景（压缩后存本地，仅自己可见） */
const fileInput = document.createElement("input");
fileInput.type = "file";
fileInput.accept = "image/*";
fileInput.style.display = "none";
document.body.appendChild(fileInput);

document.getElementById("bgUpload").addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", () => {
  const file = fileInput.files && fileInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const MAX = 1920;
      const scale = Math.min(1, MAX / Math.max(img.width, img.height));
      const cv = document.createElement("canvas");
      cv.width = Math.round(img.width * scale);
      cv.height = Math.round(img.height * scale);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      const dataUrl = cv.toDataURL("image/jpeg", 0.82);
      applyCustomImage(dataUrl);
      try {
        localStorage.setItem(BG_IMG_KEY, dataUrl);
        localStorage.setItem(BG_KEY, "custom");
        const cus = document.querySelector('.sw[data-id="custom"]');
        cus.style.display = "block";
        cus.style.backgroundImage = "url('" + dataUrl + "')";
        cus.style.backgroundSize = "cover";
        markSwatch("custom");
      } catch (e) {
        console.warn("背景图太大，未能保存到本地", e);
      }
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
  fileInput.value = "";
});

document.getElementById("bgReset").addEventListener("click", () => {
  applyPreset(BG_PRESETS[0]);
  try { localStorage.setItem(BG_KEY, "sky"); localStorage.removeItem(BG_IMG_KEY); } catch (e) {}
  const cus = document.querySelector('.sw[data-id="custom"]');
  cus.style.display = "none";
  cus.style.backgroundImage = "none";
});

/* ── 站点信息 ── */
let photos = [];

function applySite(site) {
  const s = Object.assign({}, FALLBACK_SITE, site || {});
  document.title = s.title;
  document.getElementById("siteTitle").textContent = s.title;
  document.getElementById("siteFooter").textContent = s.footer || FALLBACK_SITE.footer;
}

/* ── 照片墙：JS 分列瀑布流，卡片比例错落 ── */
/* 比例池（宽/高），长度 7 与列数互质，保证同列内比例不重复 */
const RATIOS = ["4 / 5", "1 / 1", "3 / 4", "5 / 4", "9 / 10", "3 / 4", "1 / 1"];

function columnCount() {
  const w = window.innerWidth;
  if (w >= 1100) return 5;
  if (w >= 900) return 4;
  if (w >= 640) return 3;
  return 2;
}

function buildCards(list) {
  const wrap = document.getElementById("cards");
  wrap.innerHTML = "";

  if (!list.length) {
    const tip = document.createElement("div");
    tip.className = "empty";
    tip.textContent = "还没有照片，去后台添加第一张吧。";
    wrap.appendChild(tip);
    return;
  }

  /* 按列数建列，照片依顺序轮流入列（从左到右），比例按序循环 */
  const n = columnCount();
  const cols = [];
  for (let c = 0; c < n; c++) {
    const col = document.createElement("div");
    col.className = "pcol";
    wrap.appendChild(col);
    cols.push(col);
  }

  list.forEach((p, i) => {
    const card = document.createElement("figure");
    card.className = "pcard";

    const thumb = document.createElement("div");
    thumb.className = "pthumb";
    thumb.style.aspectRatio = RATIOS[(i * 2 + Math.floor(i / 7)) % RATIOS.length];
    thumb.addEventListener("click", () => openLb(i));

    const img = document.createElement("img");
    img.src = p.src;
    img.alt = p.title || ("照片 " + (i + 1));
    img.loading = i < 10 ? "eager" : "lazy";
    thumb.appendChild(img);
    card.appendChild(thumb);

    const label = document.createElement("figcaption");
    label.className = "plabel";
    label.textContent = p.title || p.date || "";
    if (!label.textContent) label.style.display = "none";
    card.appendChild(label);

    cols[i % n].appendChild(card);
  });
}

/* 窗口宽度变化时按新列数重建 */
let resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => buildCards(photos), 200);
});

/* ── 看大图 ── */
let cur = 0;
const lb = document.getElementById("lightbox");
const lbImg = document.getElementById("lbImg");
const lbCount = document.getElementById("lbCount");

function openLb(i) {
  cur = i;
  show();
  lb.classList.add("open");
}
function closeLb() {
  lb.classList.remove("open");
}
function step(d) {
  if (!photos.length) return;
  cur = (cur + d + photos.length) % photos.length;
  show();
}
function show() {
  const p = photos[cur];
  if (!p) return;
  lbImg.src = p.src;
  lbImg.alt = p.title || ("照片 " + (cur + 1));
  let label = (cur + 1) + " / " + photos.length;
  if (p.title) label += " · " + p.title;
  else if (p.date) label += " · " + p.date;
  lbCount.textContent = label;
}

document.addEventListener("keydown", e => {
  if (!lb.classList.contains("open")) return;
  if (e.key === "Escape") closeLb();
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});
lb.addEventListener("click", e => { if (e.target === lb) closeLb(); });

/* ── 启动 ── */
(async function init() {
  const site = await loadJSON("data/site.json", FALLBACK_SITE);
  applySite(site);

  const list = await loadJSON("data/photos.json", null);
  photos = (Array.isArray(list) ? list : FALLBACK_PHOTOS)
    .filter(p => p && p.src)
    .map(p => ({ src: normalize(p.src), title: p.title || "", date: p.date || "" }));

  /* 按拍摄日期倒序（后台新上传的照片会追加到列表末尾，这里统一重排） */
  photos.sort((a, b) => {
    if (!a.date && !b.date) return 0;
    if (!a.date) return 1;
    if (!b.date) return -1;
    return b.date.localeCompare(a.date);
  });

  const total = photos.length;
  document.getElementById("siteMeta").textContent =
    "共 " + total + " 张照片 · 持续更新";

  buildCards(photos);
})();
</script>
