<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>毛孩子的日常</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    color: #333;
    background: #fff;
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  img { display: block; }
  a { color: inherit; text-decoration: none; }

  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px; }

  /* ── 第一行：站头 ───────────────────────────── */
  .site-header {
    background: #fff;
    border-bottom: 1px solid #e6e6e6;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .site-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 62px;
    gap: 12px;
  }
  .brand {
    display: flex;
    align-items: center;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #111;
    white-space: nowrap;
  }
  .brand .mark {
    width: 4px;
    height: 20px;
    background: #c8102e;
    margin-right: 10px;
    border-radius: 1px;
  }
  .site-meta {
    font-size: 12px;
    color: #999;
    letter-spacing: .5px;
    white-space: nowrap;
  }

  /* ── 区块标题 ───────────────────────────────── */
  .section { margin-top: 28px; }
  .sec-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 1px solid #eaeaea;
    padding-bottom: 8px;
    margin-bottom: 14px;
  }
  .sec-title {
    position: relative;
    padding-left: 10px;
    font-size: 16px;
    font-weight: 700;
    color: #1a1a1a;
    letter-spacing: 1px;
  }
  .sec-title::before {
    content: "";
    position: absolute;
    left: 0;
    top: 4px;
    bottom: 4px;
    width: 3px;
    background: #c8102e;
  }
  .sec-extra { font-size: 12px; color: #999; }

  /* ── 第二行：轮播 ───────────────────────────── */
  .hero {
    position: relative;
    background: #111;
    overflow: hidden;
    margin-top: 20px;
  }
  .hero-track { position: relative; aspect-ratio: 16 / 7; }
  .slide {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity .7s ease;
  }
  .slide.on { opacity: 1; }
  .slide img { width: 100%; height: 100%; object-fit: cover; }
  .slide-cap {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 60px 20px 14px;
    background: linear-gradient(to top, rgba(0,0,0,.7), rgba(0,0,0,.25) 55%, transparent);
    color: #fff;
    font-size: 14px;
    letter-spacing: .5px;
  }
  .slide-cap .date { font-size: 12px; opacity: .75; margin-right: 8px; }
  .hero-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 40px;
    height: 64px;
    border: none;
    background: rgba(0,0,0,.35);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    opacity: 0;
    transition: opacity .25s, background .25s;
  }
  .hero:hover .hero-btn { opacity: 1; }
  .hero-btn:hover { background: rgba(200,16,46,.85); }
  .hero-prev { left: 0; }
  .hero-next { right: 0; }
  .hero-dots {
    position: absolute;
    right: 16px;
    bottom: 14px;
    display: flex;
    gap: 7px;
    z-index: 5;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,.45);
    cursor: pointer;
    transition: background .25s, transform .25s;
  }
  .dot.on { background: #fff; transform: scale(1.15); }

  /* ── 第三行：图片网格 ───────────────────────── */
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }
  .card {
    position: relative;
    overflow: hidden;
    background: #f5f5f5;
    cursor: zoom-in;
  }
  .card .thumb { aspect-ratio: 1 / 1; overflow: hidden; }
  .card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform .55s cubic-bezier(.2,.6,.3,1), filter .4s ease;
  }
  .card:hover img { transform: scale(1.12); filter: brightness(1.04); }
  .card .info {
    position: absolute;
    inset: auto 0 0 0;
    padding: 26px 10px 8px;
    background: linear-gradient(to top, rgba(0,0,0,.6), transparent);
    color: #fff;
    font-size: 12px;
    letter-spacing: .5px;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity .3s, transform .3s;
    pointer-events: none;
  }
  .card:hover .info { opacity: 1; transform: none; }
  .card .info .t { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .empty { padding: 60px 0; text-align: center; color: #999; }

  /* ── 第四行：页脚（内容待定） ────────────────── */
  .site-footer {
    margin-top: 44px;
    border-top: 1px solid #e6e6e6;
    background: #fafafa;
    padding: 26px 0 30px;
    color: #999;
    font-size: 12px;
  }
  .footer-inner {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 24px;
    align-items: center;
    justify-content: space-between;
  }
  .footer-links { display: flex; gap: 18px; }
  .footer-links span { color: #bbb; }

  /* ── 看大图 ─────────────────────────────────── */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.94);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .lightbox.open { display: flex; }
  .lightbox img {
    max-width: 92vw;
    max-height: 86vh;
    box-shadow: 0 0 40px rgba(0,0,0,.6);
  }
  .lb-btn {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    width: 52px;
    height: 52px;
    border: none;
    border-radius: 50%;
    background: rgba(255,255,255,.14);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    transition: background .2s;
  }
  .lb-btn:hover { background: rgba(200,16,46,.9); }
  .lb-prev { left: 18px; }
  .lb-next { right: 18px; }
  .lb-close {
    position: fixed;
    top: 14px;
    right: 20px;
    background: none;
    border: none;
    color: #fff;
    font-size: 30px;
    line-height: 1;
    cursor: pointer;
  }
  .lb-count {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    color: rgba(255,255,255,.8);
    font-size: 12px;
    letter-spacing: 2px;
    max-width: 90vw;
    text-align: center;
  }

  @media (max-width: 900px) {
    .grid { grid-template-columns: repeat(3, 1fr); }
    .hero-track { aspect-ratio: 16 / 9; }
    .brand { font-size: 22px; }
  }
  @media (max-width: 640px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .hero-track { aspect-ratio: 4 / 3; }
    .site-inner { height: 54px; }
    .site-meta { display: none; }
    .brand { font-size: 20px; letter-spacing: 1px; }
    .footer-inner { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>

<!-- 第一行：标题 -->
<header class="site-header">
  <div class="wrap site-inner">
    <div class="brand"><span class="mark"></span><span id="siteTitle">毛孩子的日常</span></div>
    <div class="site-meta" id="siteMeta"></div>
  </div>
</header>

<main class="wrap">

  <!-- 第二行：轮播（最新 5 张） -->
  <section class="hero" id="hero">
    <div class="hero-track" id="heroTrack"></div>
    <button class="hero-btn hero-prev" id="heroPrev" aria-label="上一张">&lsaquo;</button>
    <button class="hero-btn hero-next" id="heroNext" aria-label="下一张">&rsaquo;</button>
    <div class="hero-dots" id="heroDots"></div>
  </section>

  <!-- 第三行：图片展示区 -->
  <section class="section">
    <div class="sec-head">
      <h2 class="sec-title">全部照片</h2>
      <span class="sec-extra" id="gridCount"></span>
    </div>
    <div class="grid" id="grid"></div>
  </section>

</main>

<!-- 第四行：页脚（位置保留，内容后续替换） -->
<footer class="site-footer">
  <div class="wrap footer-inner">
    <div id="siteFooter">页脚区域 · 内容待补充</div>
    <div class="footer-links">
      <span>栏目一</span><span>栏目二</span><span>栏目三</span>
    </div>
  </div>
</footer>

<!-- 看大图 -->
<div class="lightbox" id="lightbox">
  <button class="lb-btn lb-prev" onclick="step(-1)">&larr;</button>
  <img id="lbImg" src="" alt="">
  <button class="lb-btn lb-next" onclick="step(1)">&rarr;</button>
  <button class="lb-close" onclick="closeLb()">&times;</button>
  <div class="lb-count" id="lbCount"></div>
</div>

<script>
/* 数据来自 data/photos.json 与 data/site.json（由 Pages CMS 后台维护） */
const FALLBACK_SITE = {
  title: "毛孩子的日常",
  subtitle: "",
  footer: "页脚区域 · 内容待补充"
};

const FALLBACK_PHOTOS = [
  "resource/jpg/IMG_20221220_092029.jpg",
  "resource/jpg/IMG_20230122_215209.jpg",
  "resource/jpg/IMG_20240713_210719.jpg",
  "resource/jpg/IMG_20251220_111019.jpg",
  "resource/jpg/IMG_20260326_105623.jpg",
  "resource/jpg/mmexport1630833163308.jpg",
  "resource/jpg/mmexport1635083111776.jpg",
  "resource/jpg/mmexport1640079407378.jpg",
  "resource/jpg/mmexport1674302285357.jpg",
  "resource/jpg/mmexport1674302288178.jpg",
  "resource/jpg/mmexport1674302290029.jpg",
  "resource/jpg/mmexport1755567784194.jpg",
  "resource/jpg/mmexport1761823362289.jpg",
  "resource/jpg/synthesis_df4e14a4-caa0-489b-8467-213893a9db76_i.jpg",
  "resource/jpg/wx_camera_1630583256505.jpg",
  "resource/jpg/wx_camera_1713361493189.jpg",
  "resource/jpg/wx_camera_1721562574208.jpg",
  "resource/jpg/wx_camera_1723602584733.jpg",
  "resource/jpg/wx_camera_1723604246051.jpg",
  "resource/jpg/wx_camera_1726366990254.jpg",
  "resource/jpg/wx_camera_1755141865991.jpg",
  "resource/jpg/wx_camera_1756119501920.jpg",
  "resource/jpg/wx_camera_1782901912680.jpg"
].map(src => ({ src: src, title: "", date: "" }));

const HERO_COUNT = 5;      // 轮播展示最新 5 张
const AUTOPLAY_MS = 5000;  // 自动切换间隔

function normalize(src) {
  return String(src || "").replace(/^\/+/, "");
}

async function loadJSON(url, fallback) {
  try {
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    return await res.json();
  } catch (err) {
    return fallback;
  }
}

let photos = [];
let heroIndex = 0;
let heroTimer = null;

/* ── 站头 / 页脚 ── */
function applySite(site) {
  const s = Object.assign({}, FALLBACK_SITE, site || {});
  document.title = s.title;
  document.getElementById("siteTitle").textContent = s.title;
  document.getElementById("siteFooter").textContent = s.footer || FALLBACK_SITE.footer;
}

/* ── 轮播 ── */
function buildHero(list) {
  const track = document.getElementById("heroTrack");
  const dots = document.getElementById("heroDots");
  track.innerHTML = "";
  dots.innerHTML = "";

  const items = list.slice(0, HERO_COUNT);
  if (!items.length) {
    document.getElementById("hero").style.display = "none";
    return;
  }

  items.forEach((p, i) => {
    const slide = document.createElement("div");
    slide.className = "slide" + (i === 0 ? " on" : "");

    const img = document.createElement("img");
    img.src = p.src;
    img.alt = p.title || ("照片 " + (i + 1));
    img.loading = i === 0 ? "eager" : "lazy";
    slide.appendChild(img);

    if (p.title || p.date) {
      const cap = document.createElement("div");
      cap.className = "slide-cap";
      if (p.date) {
        const d = document.createElement("span");
        d.className = "date";
        d.textContent = p.date;
        cap.appendChild(d);
      }
      cap.appendChild(document.createTextNode(p.title || ""));
      slide.appendChild(cap);
    }

    slide.addEventListener("click", () => openLb(i));
    track.appendChild(slide);

    const dot = document.createElement("div");
    dot.className = "dot" + (i === 0 ? " on" : "");
    dot.addEventListener("click", () => goHero(i));
    dots.appendChild(dot);
  });

  startAuto();
}

function goHero(i) {
  const slides = document.querySelectorAll("#heroTrack .slide");
  const dots = document.querySelectorAll("#heroDots .dot");
  if (!slides.length) return;
  heroIndex = (i + slides.length) % slides.length;
  slides.forEach((s, k) => s.classList.toggle("on", k === heroIndex));
  dots.forEach((d, k) => d.classList.toggle("on", k === heroIndex));
}

function startAuto() {
  stopAuto();
  if (document.querySelectorAll("#heroTrack .slide").length < 2) return;
  heroTimer = setInterval(() => goHero(heroIndex + 1), AUTOPLAY_MS);
}
function stopAuto() {
  if (heroTimer) { clearInterval(heroTimer); heroTimer = null; }
}

/* ── 网格 ── */
function buildGrid(list) {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  if (!list.length) {
    const tip = document.createElement("div");
    tip.className = "empty";
    tip.textContent = "还没有照片，去后台添加第一张吧。";
    grid.appendChild(tip);
    document.getElementById("gridCount").textContent = "";
    return;
  }

  list.forEach((p, i) => {
    const card = document.createElement("figure");
    card.className = "card";
    card.addEventListener("click", () => openLb(i));

    const thumb = document.createElement("div");
    thumb.className = "thumb";

    const img = document.createElement("img");
    img.src = p.src;
    img.alt = p.title || ("照片 " + (i + 1));
    img.loading = i < 8 ? "eager" : "lazy";
    thumb.appendChild(img);
    card.appendChild(thumb);

    const info = document.createElement("figcaption");
    info.className = "info";
    const t = document.createElement("span");
    t.className = "t";
    t.textContent = p.title || p.date || ("照片 " + (i + 1));
    info.appendChild(t);
    card.appendChild(info);

    grid.appendChild(card);
  });

  document.getElementById("gridCount").textContent = "共 " + list.length + " 张";
}

/* ── 看大图 ── */
let cur = 0;
const lb = document.getElementById("lightbox");
const lbImg = document.getElementById("lbImg");
const lbCount = document.getElementById("lbCount");

function openLb(i) {
  cur = i;
  show();
  lb.classList.add("open");
  document.body.style.overflow = "hidden";
  stopAuto();
}
function closeLb() {
  lb.classList.remove("open");
  document.body.style.overflow = "";
  startAuto();
}
function step(d) {
  if (!photos.length) return;
  cur = (cur + d + photos.length) % photos.length;
  show();
}
function show() {
  const p = photos[cur];
  if (!p) return;
  lbImg.src = p.src;
  lbImg.alt = p.title || ("照片 " + (cur + 1));
  let label = (cur + 1) + " / " + photos.length;
  if (p.title) label += " · " + p.title;
  else if (p.date) label += " · " + p.date;
  lbCount.textContent = label;
}

document.addEventListener("keydown", e => {
  if (!lb.classList.contains("open")) return;
  if (e.key === "Escape") closeLb();
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});
lb.addEventListener("click", e => { if (e.target === lb) closeLb(); });

document.getElementById("heroPrev").addEventListener("click", () => { goHero(heroIndex - 1); startAuto(); });
document.getElementById("heroNext").addEventListener("click", () => { goHero(heroIndex + 1); startAuto(); });
document.getElementById("hero").addEventListener("mouseenter", stopAuto);
document.getElementById("hero").addEventListener("mouseleave", startAuto);

/* ── 启动 ── */
(async function init() {
  const site = await loadJSON("data/site.json", FALLBACK_SITE);
  applySite(site);

  const list = await loadJSON("data/photos.json", null);
  photos = (Array.isArray(list) ? list : FALLBACK_PHOTOS)
    .filter(p => p && p.src)
    .map(p => ({ src: normalize(p.src), title: p.title || "", date: p.date || "" }));

  /* 按拍摄日期倒序（后台新上传的照片会追加到列表末尾，这里统一重排） */
  photos.sort((a, b) => {
    if (!a.date && !b.date) return 0;
    if (!a.date) return 1;
    if (!b.date) return -1;
    return b.date.localeCompare(a.date);
  });

  const total = photos.length;
  document.getElementById("siteMeta").textContent =
    "共 " + total + " 张照片 · 持续更新";

  buildHero(photos);
  buildGrid(photos);
})();
</script>
</body>
</html>
